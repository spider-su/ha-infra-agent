[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-infra-agent"
version = "0.1.0"
description = "Small configuration-driven infrastructure collector for Home Assistant"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "paho-mqtt>=2.1,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2", "speedtest-cli>=2.1.3,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
home-infra-agent = "home_infra_agent.app:main"

[tool.setuptools.packages.find]
include = ["home_infra_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
