name: Docker Build and Publish

on:
  workflow_run:
    workflows:
      - Home Infra Agent CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install '.[test]'
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build and publish Home Infra Agent image
    needs: manual-validation
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.manual-validation.result == 'success' || needs.manual-validation.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify Docker build inputs
        run: |
          test -f Dockerfile
          test -f pyproject.toml
          test -f home_infra_agent/app.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: aserobaba/home-infra-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=home-infra-agent
          cache-to: type=gha,scope=home-infra-agent,mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aserobaba/home-infra-agent@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: aserobaba/home-infra-agent@${{ steps.image.outputs.digest }}
          artifact-name: home-infra-agent-image.spdx.json
          output-file: home-infra-agent.spdx.json
      - name: Upload image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: home-infra-agent-image-sbom
          path: home-infra-agent.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published Home Infra Agent image'
            echo
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo "docker.io/aserobaba/home-infra-agent@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
