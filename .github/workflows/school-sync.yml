name: School Calendar Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate without writing to Google Calendar"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: school-calendar-sync
  cancel-in-progress: false

jobs:
  school-sync:
    name: eduVULCAN to Google Calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VULCAN_CREDENTIAL_JSON: ${{ secrets.VULCAN_CREDENTIAL_JSON }}
      VULCAN_PUPIL_INDEX: ${{ vars.VULCAN_PUPIL_INDEX || '0' }}
      GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      SYNC_DAYS_BACK: "7"
      SYNC_DAYS_AHEAD: "60"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/school-sync-requirements.txt

      - name: Install school sync dependencies
        run: python -m pip install -r scripts/school-sync-requirements.txt

      - name: Sync calendar
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            python scripts/school_calendar_sync.py --dry-run
          else
            python scripts/school_calendar_sync.py
          fi
