name: Water invoice MQTT
schedule:
  interval: 300s
timeout: 10s
freshness:
  maxAge: 900s
mqtt:
  enabled: true
  auto_discover_values: false
  retire_entities: [source_state_changed, reading.source_state_changed, reading.cumulative_m3, reading.estimated_cumulative_m3, reading.estimated_since_reading_m3, reading.last_reading_at, reading.last_reading_m3, reading.step_m3_per_day, reading.active_mode, reading.calculated_at]
  topic: home/meters/water
  device:
    name: Water invoice MQTT
    manufacturer: Home Infra Agent
    model: Manual cumulative meter bridge
  entities:
    cumulative_m3: {name: Water meter cumulative reading, device_class: water, state_class: total_increasing, unit_of_measurement: "m³", expire_after: 900}
    estimated_cumulative_m3: {name: Water estimated cumulative reading, state_class: measurement, unit_of_measurement: "m³", expire_after: 900}
    estimated_since_reading_m3: {name: Water estimated since last reading, state_class: measurement, unit_of_measurement: "m³", expire_after: 900}
    last_reading_m3: {name: Water last real reading, state_class: measurement, unit_of_measurement: "m³", expire_after: 900}
    last_reading_at: {name: Water last real reading at, device_class: timestamp, expire_after: 900}
    active_mode: {name: Water active season mode, expire_after: 900}
    step_m3_per_day: {name: Water configured daily step, unit_of_measurement: "m³/d", state_class: measurement, expire_after: 900}
    calculated_at: {name: Water calculation time, device_class: timestamp, expire_after: 900}
