name: Investory Portfolio
schedule:
  cron: "0 9-22 * * 1-5"
  timezone: Europe/Warsaw
timeout: 15s
freshness:
  maxAge: 259200s
mqtt:
  enabled: true
  topic: home/investory/portfolio
  device:
    name: Investory Portfolio
    manufacturer: Investory
    model: Portfolio Summary
  entities:
    snapshotDate:
      device_class: date
    equity:
      device_class: monetary
      state_class: measurement
      unit_of_measurement_field: baseCurrency
    totalProfit:
      device_class: monetary
      state_class: measurement
      unit_of_measurement_field: baseCurrency
