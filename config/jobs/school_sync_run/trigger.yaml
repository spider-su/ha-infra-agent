# Dispatch the mock school calendar sync workflow.
# Requires GITHUB_ACTIONS_TRIGGER_TOKEN in the agent runtime environment.
type: http
method: POST
url: https://api.github.com/repos/spider-su/ha-infra-agent/actions/workflows/school-sync.yml/dispatches
headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
auth:
  type: bearer
  tokenEnv: GITHUB_ACTIONS_TRIGGER_TOKEN
body:
  ref: main
expectedStatusCodes: [204]
timeout: 10s
